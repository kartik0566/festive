services:
  server:
    build:
      context: ./server
    container_name: festive-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      PORT: 5000
      NODE_ENV: development
      CLIENT_URL: http://localhost:5180
      JWT_SECRET: local-dev-secret-change-before-production
      JWT_EXPIRES_IN: 7d
      ADMIN_NAME: Festive Admin
      ADMIN_EMAIL: admin@festive.local
      ADMIN_PASSWORD: Admin@12345
      RAZORPAY_CURRENCY: INR
      MAIL_FROM: Festive Events <hello@festive.local>
      MAIL_TO: admin@festive.local
    ports:
      - "5001:5000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5001/api
    container_name: festive-client
    restart: unless-stopped
    ports:
      - "5180:5180"
    depends_on:
      server:
        condition: service_healthy

